{% extends 'base.html' %} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header bg-primary-colour text-white">
        <h3 class="card-title mb-0">Login</h3>
      </div>
      <div class="card-body">
        <form method="post" action="{{ url_for('login') }}" id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              required
            />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              required
            />
          </div>
          <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-primary">Login</button>
            <a href="{{ url_for('register') }}" class="btn btn-link"
              >Don't have an account? Register</a
            >
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Track login form submission
    const loginForm = document.getElementById('loginForm');
    if (loginForm) {
      loginForm.addEventListener('submit', function() {
        gtag('event', 'login_attempt', {
          event_category: 'authentication',
          event_label: 'login_form_submit'
        });
      });
    }
    
    // Track register link clicks
    const registerLink = document.querySelector('a[href="{{ url_for("register") }}"]');
    if (registerLink) {
      registerLink.addEventListener('click', function() {
        gtag('event', 'click', {
          event_category: 'navigation',
          event_label: 'register_link_click'
        });
      });
    }
  });
</script>
{% endblock %}
